[package]
name = "tonestrand"
version = "1.0.0-beta.5"
edition = "2021"
description = "ToneStrand: preset editor for Helix-family pedals, over USB or through a Helrig Box"
license = "GPL-3.0-or-later"

[workspace]
members = [".", "core"]

[dependencies]
tonestrand-core = { path = "core" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
mdns-sd = "0.13"
rfd = "0.15"
png = "0.17"
dirs = "5"

[dev-dependencies]
tonestrand-core = { path = "core", features = ["test-support"] }

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
webbrowser = { path = "vendor/webbrowser" }
autocfg = { path = "vendor/autocfg" }
