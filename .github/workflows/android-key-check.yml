# Run by hand ("Run workflow"): tests the four Android signing secrets against each other and says what is wrong, without ever
# printing a secret (GitHub also hides their values in logs). It prints lengths, yes/no answers and the alias names found in the
# keystore (names and fingerprints are not secret). See docs/ANDROID.md, "Releasing the Android app".
name: Android signing check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Check the secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "ANDROID_KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64}"
          echo "ANDROID_KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
          echo "ANDROID_KEY_ALIAS length: ${#KEY_ALIAS}"
          echo "ANDROID_KEY_PASSWORD length: ${#KEY_PASSWORD}"
          if [ "$KEY_ALIAS" != "$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')" ]; then
            echo "The alias secret CONTAINS WHITESPACE (a space, tab or line break): set it again with only the name."
          fi
          F="$RUNNER_TEMP/check.keystore"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$F" 2>/dev/null || [ ! -s "$F" ]; then
            echo "RESULT: the keystore secret is not valid base64 or is empty."
            exit 1
          fi
          echo "keystore file size: $(stat -c %s "$F") bytes"
          if ! LIST=$(keytool -list -keystore "$F" -storepass "$KEYSTORE_PASSWORD" 2>&1); then
            echo "RESULT: the keystore opens only with the right password, and ANDROID_KEYSTORE_PASSWORD is NOT it (or the file is damaged)."
            echo "keytool said (no secrets in it):"
            echo "$LIST" | sed 's/^/  /' | head -5
            exit 1
          fi
          echo "keystore password: OK"
          echo "== what keytool lists (alias names and fingerprints only)"
          echo "$LIST" | sed 's/^/  /'
          ALIASES=$(echo "$LIST" | grep -E 'PrivateKeyEntry' | cut -d, -f1)
          COUNT=$(echo "$ALIASES" | grep -c . || true)
          echo "private keys in the keystore: $COUNT"
          if [ "$COUNT" = "0" ]; then echo "RESULT: the keystore holds no private key."; exit 1; fi
          if echo "$ALIASES" | grep -Fxq -- "$KEY_ALIAS"; then
            echo "alias secret matches an alias exactly: yes"
            REAL="$KEY_ALIAS"
          elif echo "$ALIASES" | grep -Fxiq -- "$KEY_ALIAS"; then
            echo "alias secret matches an alias only when letter case is ignored: set it to the name shown above, in the same case."
            REAL=$(echo "$ALIASES" | grep -Fxi -- "$KEY_ALIAS" | head -1)
          else
            echo "RESULT: ANDROID_KEY_ALIAS matches none of the aliases above."
            echo "It has ${#KEY_ALIAS} characters; the real alias has $(echo "$ALIASES" | head -1 | tr -d '\n' | wc -c)."
            if [ "$KEY_ALIAS" = "$KEYSTORE_PASSWORD" ]; then echo "The alias secret is the SAME as the keystore password: the values were probably entered in the wrong order."; fi
            if [ "$KEY_ALIAS" = "$KEY_PASSWORD" ]; then echo "The alias secret is the SAME as the key password: the values were probably entered in the wrong order."; fi
            exit 1
          fi
          cp "$F" "$F.copy"
          if keytool -keypasswd -alias "$REAL" -keystore "$F.copy" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -new "$KEY_PASSWORD" >/dev/null 2>&1; then
            echo "key password: OK"
            echo "RESULT: all four secrets fit together. Signing should work."
          else
            echo "RESULT: ANDROID_KEY_PASSWORD is NOT the password of that key. (If you pressed Enter for the key password in keytool, it is the same as the keystore password.)"
            exit 1
          fi
          rm -f "$F" "$F.copy"
